<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#0d0e10">
        <title>Sin conexión · Onda</title>
        <link rel="icon" type="image/svg+xml" href="/favicon.svg">
        <style>
            html, body { height: 100%; margin: 0; }
            body {
                display: grid; place-items: center; padding: 24px; box-sizing: border-box;
                background: #0d0e10; color: #edece8; text-align: center;
                font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
            }
            img { width: 56px; height: 56px; }
            h1 { margin: 20px 0 8px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
            p { margin: 0 auto; max-width: 30ch; font-size: 15px; line-height: 1.5; color: rgb(237 236 232 / 0.62); }
            button {
                margin-top: 24px; padding: 10px 22px; border: 0; border-radius: 999px; cursor: pointer;
                background: #edece8; color: #0d0e10; font: inherit; font-size: 14px; font-weight: 600;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/favicon.svg" alt="">
            <h1>Sin conexión</h1>
            <p>Onda necesita internet para cargar tu música. Revisa tu conexión y vuelve a intentarlo.</p>
            <button type="button" onclick="location.reload()">Reintentar</button>
        </main>
    </body>
</html>
